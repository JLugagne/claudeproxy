services:
  claudeproxy:
    build: .
    image: claudeproxy:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CLAUDEPROXY_PORT:-8787}:8787"
    environment:
      # Set the keys of the providers enabled in configs/config.yaml, in .env
      # or the environment.
      OPENCODE_API_KEY: ${OPENCODE_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    # Run as the host user so the bind-mounted ./data stays writable and owned
    # by you. Create it first: mkdir -p data
    user: "${CLAUDEPROXY_UID:-1000}:${CLAUDEPROXY_GID:-1000}"
    volumes:
      - ./configs/config.yaml:/etc/claudeproxy/config.yaml:ro
      # Usage database (metrics.path in the config), stored on the host disk.
      - ./data:/var/lib/claudeproxy
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
